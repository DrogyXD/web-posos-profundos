    </div>

    <!-- Modal de Bootstrap -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body d-flex flex-column flex-md-row">
                <div class="modal-media">
                    <!-- Mostrar imagen o video dinámicamente -->
                    <ng-container *ngIf="isVideo(selectedMedia); else imageTemplate">
                        <video [src]="selectedMedia" class="img-fluid rounded modal-video" controls autoplay muted></video>
                    </ng-container>
                    <ng-template #imageTemplate>
                        <img [src]="selectedMedia" class="img-fluid rounded modal-img" alt="Media seleccionada">
                    </ng-template>
                </div>
                <div class="modal-description">
                    <h4 class="modal-title mb-3">{{selectedTitle}}</h4> <!-- Título añadido -->
                    <p>{{selectedDescription}}</p> <!-- Descripción de la imagen/video -->
                </div>
            </div>
        </div>
    </div>
</div>
</section>
